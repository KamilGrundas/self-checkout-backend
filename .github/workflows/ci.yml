name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_NAME: Self Checkout Backend CI
      ENVIRONMENT: local
      SECRET_KEY: ci-only-secret-key-not-for-deployment
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci-only
      MINIO_SECRET_KEY: ci-only
      MINIO_BUCKET_NAME: product-images
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_USE_SSL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.14.6"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Lint and type-check
        run: uv run bash scripts/lint.sh
      - name: Tests
        run: uv run bash scripts/tests-start.sh
